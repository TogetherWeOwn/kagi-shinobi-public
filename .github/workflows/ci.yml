name: CI

on:
  push:
    branches: [main, "v1-**"]
  pull_request:
  # Release PRs are opened with GITHUB_TOKEN, which starts no workflows, so
  # their CI is dispatched by hand (see release-please.yml).
  workflow_dispatch:
  # Nightly full suite: the `changes` job forces every area true
  # on `schedule`, so this run always exercises the whole pipeline.
  schedule:
    - cron: "17 4 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Change detection (CI standard). Native `git diff --name-only`
  # against the merge base — no third-party action. One boolean per area;
  # heavy jobs below run only when their area changed. Push-to-main,
  # schedule and dispatch runs force every area true (full suite).
  changes:
    # Public repositories run on GitHub-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      deps: ${{ steps.filter.outputs.deps }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history: without the merge base the diff below is wrong.
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "full suite on $EVENT: every area true"
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "deps=true" >> "$GITHUB_OUTPUT"
            echo "ci=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="origin/${BASE_REF}"
          MERGE_BASE=$(git merge-base "$BASE" HEAD)
          # --no-renames: with rename detection `git mv src/x.ts docs/x.ts`
          # lists only the new path, so the deleted code file would look
          # docs-only. A rename is a delete plus an add; both sides must show.
          FILES=$(git diff --name-only --no-renames "$MERGE_BASE" HEAD)
          echo "changed files:"
          echo "$FILES"
          code=false; deps=false; ci=false
          while IFS= read -r f; do
            case "$f" in
              src/*|test/*|ci/*|wrangler.jsonc|tsconfig.json|vitest.config.ts|playwright.config.ts) code=true ;;
              package.json|package-lock.json|.npmrc) deps=true ;;
              .github/*) ci=true ;;
            esac
          done <<< "$FILES"
          # The filter itself, CI config and dep manifests force a full run.
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "deps=$deps" >> "$GITHUB_OUTPUT"
          echo "ci=$ci" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    # Docs-only PRs (docs/**, *.md, .claude/**, .dev.vars.example) change no
    # area above, so this heavy job skips and ci-ok still goes green.
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.ci == 'true'
    # Public GitHub-hosted runner. No job container:
    # node + workerd only — no services, no browsers (Playwright uses its
    # `request` fixture only, and CI never downloads browser binaries).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          # wrangler requires >= 22; the `wrangler types` step below fails
          # outright on 20, before typecheck or tests ever run.
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Regenerate the ambient Cloudflare.Env types from wrangler.jsonc.
      # No auth needed — pure type generation.
      #
      # Deliberately the npm script rather than `npx wrangler types` directly:
      # the flags (--strict-vars=false, see src/env.ts) then live in exactly one
      # place. worker-configuration.d.ts is gitignored, so this step is what CI
      # type checks against, and a flag that drifts between here and
      # package.json fails CI on source that is fine locally.
      - run: npm run cf-typegen
      - run: npm run typecheck
      # test:coverage, not test — same suite, but it is the only entry point
      # that enforces the thresholds in vitest.config.ts. Under plain `npm
      # test` the ratchet never runs and coverage can slide back unnoticed.
      - run: npm run test:coverage
      # dry-run catches broken bindings/migrations without deploying.
      - run: npx wrangler deploy --dry-run
      # End-to-end: boots a real `wrangler dev` and talks to it over HTTP, so
      # it catches what the steps above cannot — a wrangler.jsonc that bundles
      # but does not boot. Needs no Cloudflare credential (every binding
      # resolves locally) and downloads no browsers: the specs use Playwright's
      # request fixture only, never a browser context.
      #
      # Deliberately *after* the dry-run rather than before. Both fail on a
      # broken wrangler.jsonc, but dry-run fails in seconds naming the offending
      # binding or migration, while this step would sit until Playwright's 120s
      # webServer timeout and then report only that the server never came up.
      # Cheapest and most specific diagnostic first.
      - run: npm run test:e2e

  # The single required check (CI standard). Passes when every
  # needed job succeeded or was skipped. Branch protection must require only
  # this (+ pr-lint, secret-scan) — cutover via Operator card to the CEO,
  # since ruleset writes are 403 for the GitHub App.
  ci-ok:
    # Public repositories run on GitHub-hosted runners.
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "changes job did not succeed: ${{ needs.changes.result }}" >&2
            exit 1
          fi
          case "${{ needs.test.result }}" in
            success|skipped) echo "ci-ok: needed jobs succeeded or were skipped." ;;
            *) echo "test job did not succeed: ${{ needs.test.result }}" >&2; exit 1 ;;
          esac
