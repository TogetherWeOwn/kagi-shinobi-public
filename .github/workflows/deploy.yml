name: Deploy

# Production deploys happen ONLY here. Merging to main never deploys —
# PR #14 proved merged != deployed.
#
# Approval (ADR 0018). The `guard` job runs ci/deploy-gate.ts before the
# `deploy` job and refuses unless the tag is a release of a commit on main with
# a green full-suite CI run on that exact SHA. Then one of two modes:
#   - repo variable PRODUCTION_AUTO_APPROVE=true: that evidence IS the approval.
#     The `production` environment keeps its main-only branch policy and needs
#     no required reviewer; nobody clicks.
#   - anything else (legacy): the guard still demands that the environment lists
#     a required reviewer, and the run then waits at `deploy` for that approval.
# Either way the secrets below are environment secrets behind a main-only
# policy: a branch with an edited copy of this file cannot read them.
#
# First-time setup (operator, one-off, needs repo admin):
#   1. Create the `production` environment (repo Settings -> Environments)
#      with a main-only deployment branch policy. Legacy mode also needs
#      required reviewers = owner/CEO; auto mode needs none (set the
#      PRODUCTION_AUTO_APPROVE repo variable instead). Do this BEFORE the
#      first run: a run that names a missing environment makes GitHub create
#      it with NO required reviewers and no branch policy.
#   2. Store two environment secrets on `production`:
#        CLOUDFLARE_API_TOKEN  — API token scoped to Workers deploy for this
#                                account (Workers Scripts:Edit; KV/DO use the
#                                ids already in wrangler.jsonc, so this rotates
#                                nothing — ADMIN_TOKEN and the Kagi cookie are
#                                untouched).
#        CLOUDFLARE_ACCOUNT_ID — the account that owns the worker.
#   3. Dispatch this workflow against the new tag, then confirm
#      `curl -H "Authorization: Bearer $ADMIN_TOKEN" $WORKER_URL/health`
#      reports the tag's commit as buildSha.

# Two entry points, both gated by `guard` and the `production` environment:
#   - workflow_call: release-please.yml calls this when a Release PR merges.
#     There is deliberately no `release: published` trigger — release-please
#     creates releases with GITHUB_TOKEN, and GitHub never starts workflows
#     from events that token creates, so that trigger would never fire.
#   - workflow_dispatch: re-deploy a past release, or the first deploy.
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to deploy (e.g. v1.2.3)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  guard:
    # Runner routing: same overflow vars as CI (see ci.yml `changes`).
    # Production environment secrets resolve on either runner class.
    runs-on: ${{ fromJSON((contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'guard') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    # Waits for the push-to-main CI run on the tagged commit (CI_WAIT_MINUTES,
    # default 30) — release-please calls this workflow the moment the Release
    # PR merges, which is the same instant that CI run starts.
    timeout-minutes: 40
    # actions: read for the CI run list and the environment; the caller in
    # release-please.yml must grant it too, since a called workflow can only
    # keep or reduce its caller's permissions.
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      # Default ref: this workflow's own commit. The gate script is not taken
      # from the tag it judges.
      - uses: actions/checkout@v7.0.1
      # Node >= 24 runs the .ts gate with no build step or dependency install.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Production deploy gate
        id: gate
        env:
          TAG: ${{ inputs.tag }}
          PRODUCTION_AUTO_APPROVE: ${{ vars.PRODUCTION_AUTO_APPROVE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node ci/deploy-gate.ts

  deploy:
    needs: guard
    # Runner routing: same overflow vars as CI (see ci.yml `changes`).
    runs-on: ${{ fromJSON((contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'deploy') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 10
    # The environment is the server-side half of the gate: a main-only branch
    # policy, plus a required reviewer in legacy mode (no
    # PRODUCTION_AUTO_APPROVE). CLOUDFLARE_* are environment secrets: they
    # resolve here, inside the gated job, on both entry points — the caller
    # passes none.
    environment: production
    # One production deploy at a time; a second one queues, never cancels
    # a deploy that is mid-flight.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Dispatch hands us a free-form string, not necessarily a tag. Deploying
      # a branch head would ship unreleased commits past the release gate, so
      # two checks stand between the input and the checkout: the name must be
      # exactly vMAJOR.MINOR.PATCH here (and again in the guard, which also
      # resolves it ONLY under refs/tags/ and requires it to be on main).
      - name: Refuse anything that is not a version tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "refusing to deploy non-release ref: $TAG" >&2
            exit 1
          fi
          echo "Deploying release $TAG"

      # The exact commit the guard judged, not the tag name: a tag can be
      # moved between the two jobs, a SHA cannot.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - name: Record the deployed commit SHA
        id: sha
        env:
          GUARDED_SHA: ${{ needs.guard.outputs.sha }}
        run: |
          SHA=$(git rev-parse HEAD)
          test -n "$SHA"
          if [ "$SHA" != "$GUARDED_SHA" ]; then
            echo "checked out $SHA, but the guard approved ${GUARDED_SHA:-nothing}" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying commit $SHA"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      # --include=dev: persistent runners may carry NODE_ENV=production, under
      # which bare `npm ci` silently skips devDependencies and the wrangler
      # step below then fails with "wrangler: not found".
      - run: npm ci --include=dev

      - name: Deploy to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          BUILD_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          # --var wins over wrangler.jsonc's BUILD_SHA default without editing
          # the file, so the deployed worker reports THIS commit from
          # authenticated /health (src/token/admin.ts).
          npx wrangler deploy --var "BUILD_SHA:${BUILD_SHA}"
