name: secret-scan

# Always runs (CI standard). Deliberately no `paths:` filter:
# this workflow produces a required check, and a workflow-level filter
# would leave the check unreported instead of green.
on:
  push:
    branches: [main, "v1-**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  gitleaks:
    # Public repositories run on GitHub-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # Pinned gitleaks binary, not gitleaks/gitleaks-action: the action
      # wrapper requires a GITLEAKS_LICENSE secret for org repos and fails
      # without one (PR #54 review). The binary itself needs no license.
      # Private RUNNER_TEMP paths: no shared scratch, no global install.
      - name: Scan with pinned gitleaks binary
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/gitleaks.tar.gz"
          BIN_DIR="$RUNNER_TEMP/gitleaks"
          mkdir -p "$BIN_DIR"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$BIN_DIR"
          "$BIN_DIR/gitleaks" version
          # .gitleaks.toml extends the default ruleset with exact-value
          # allowlists for documented non-secrets. Full history still scans.
          "$BIN_DIR/gitleaks" detect --source . --config .gitleaks.toml --verbose
