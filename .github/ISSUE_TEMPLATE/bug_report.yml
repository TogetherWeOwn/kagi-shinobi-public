name: Bug report
description: Something is broken or behaving unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Fill out the sections below so we can reproduce and triage quickly.

        > **⚠️ Privacy notice:** Fields below accept logs, request bodies and config output that may contain
        > **personally identifiable information (PII)** — search queries, usernames in file paths, API keys,
        > bearer tokens, the Kagi session token, or agent output. Before pasting:
        > 1. Review for sensitive data
        > 2. Redact usernames, paths, API keys, tokens (e.g. replace `/home/yourname/` with `/home/REDACTED/`)
        > 3. **Never paste a live credential.** If you pasted one by accident, say so in the report so it can be rotated.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-submission checklist
      description: Please confirm each of these before filing.
      options:
        - label: I have searched existing open and closed issues and this is not a duplicate.
          required: true
        - label: I can reproduce on the latest `main`.
          required: true
        - label: I have confirmed the error originates in this worker, not in my client configuration or an expired Kagi session token (check `/health` first).
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug. Name the exact endpoint or MCP tool involved.
      placeholder: When I POST /search with engine "auto", the response is a 500 instead of falling back to SearXNG.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps a maintainer can follow. Include the request shape (no real tokens) and the commit SHA or `BUILD_SHA` you ran.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit SHA or BUILD_SHA
      description: The commit you ran (`git rev-parse --short HEAD`), or the deployed `BUILD_SHA` that `/health` reports to an authorised caller.
      placeholder: e.g. f4c1c2a
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      description: Which way in did you hit the bug?
      options:
        - MCP (/mcp)
        - REST search (/search)
        - REST summarize (/summarize)
        - Admin (/admin/token, /admin/refresh)
        - Health (/health)
        - Local dev (npm run dev)
        - CI or deploy workflow
        - Other
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where did the bug occur?
      options:
        - Production worker
        - Local wrangler dev
        - CI runner
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: |
        Paste error messages, stack traces, response bodies or command output. Rendered as a code block.

        **⚠️ PII warning:** Logs often contain search queries and file paths with your username. Redact before pasting. Never paste tokens.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, related issues, or anything else that might help.

  - type: checkboxes
    id: pii_confirmed
    attributes:
      label: Privacy checklist
      description: Please confirm you reviewed your submission for sensitive data.
      options:
        - label: I reviewed all pasted output for PII (search queries, usernames, file paths, API keys, bearer tokens, Kagi session tokens, company names) and redacted where necessary. No live credential is included.
          required: true
